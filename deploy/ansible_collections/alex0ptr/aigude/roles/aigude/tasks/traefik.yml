---
- name: AI Gude | folders of the route and the sign-ins
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ [aigude_traefik_dynamic_dir, aigude_traefik_users_file | dirname] | unique }}"

- name: AI Gude | packages for hashing passwords
  ansible.builtin.package:
    name:
      - python3-passlib
      - python3-bcrypt
    state: present
  register: aigude_htpasswd_packages
  when:
    - aigude_install_htpasswd_dependencies
    - aigude_password_users | length > 0

- name: AI Gude | record whether the hashing packages are there now
  ansible.builtin.set_fact:
    aigude_htpasswd_ready: "{{ not (ansible_check_mode and aigude_htpasswd_packages.changed | default(false)) }}"

# Traefik reads the file of the sign-ins when it loads the route and does not watch it, so a changed file needs the
# restart of Traefik that the handler does. A checksum in the route file does not help: Traefik drops a parsed
# configuration that did not change.
# A hash is written as it is, the file may hold other lines.
- name: AI Gude | sign-ins with a password hash
  ansible.builtin.lineinfile:
    path: "{{ aigude_traefik_users_file }}"
    regexp: "^{{ item.name | regex_escape }}:"
    line: "{{ item.name }}:{{ item.password_hash }}"
    create: true
    owner: root
    group: root
    mode: "0640"
  loop: "{{ aigude_hash_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  notify: Restart traefik for sign-ins

- name: AI Gude | sign-ins with a clear text password
  community.general.htpasswd:
    path: "{{ aigude_traefik_users_file }}"
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    crypt_scheme: bcrypt
    owner: root
    group: root
    mode: "0640"
  loop: "{{ aigude_password_users }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: aigude_htpasswd_ready
  notify: Restart traefik for sign-ins

# Traefik watches the folder, so a changed route needs no restart.
- name: AI Gude | route
  ansible.builtin.template:
    src: traefik-route.yml.j2
    dest: "{{ aigude_traefik_dynamic_dir }}/{{ aigude_traefik_router_name }}.yml"
    owner: root
    group: root
    mode: "0644"

- name: AI Gude | look for the User Config of every sign-in
  ansible.builtin.stat:
    path: "{{ aigude_users_dir }}/{{ item.name }}.toml"
  loop: "{{ aigude_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: aigude_user_config_stat

- name: AI Gude | warn about a sign-in without a User Config
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ item.item.name }} can sign in but has no User Config {{ aigude_users_dir }}/{{ item.item.name }}.toml;
      AI Gude answers such a User with 403.
  loop: "{{ aigude_user_config_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists
