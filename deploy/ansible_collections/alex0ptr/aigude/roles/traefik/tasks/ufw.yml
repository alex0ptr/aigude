---
- name: Traefik | allow the published ports in ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "{{ traefik_http_port }}"
    - "{{ traefik_https_port }}"

# A published port reaches the container by forwarding (DNAT), not by INPUT. ufw denies routed packets, and Netavark
# lets only ESTABLISHED and RELATED ones through to the container, so without this rule nothing arrives from outside,
# the challenge of the ACME server included.
- name: Traefik | allow the routed ports to the network in ufw
  community.general.ufw:
    rule: allow
    route: true
    proto: tcp
    to_ip: "{{ traefik_network_subnet }}"
    to_port: "{{ item }}"
  loop: ["80", "443"]

# Containers ask the DNS of the network at its gateway, an address of the host: that is INPUT, which ufw denies.
- name: Traefik | allow the DNS of the network in ufw
  community.general.ufw:
    rule: allow
    from_ip: "{{ traefik_network_subnet }}"
    to_port: "53"
